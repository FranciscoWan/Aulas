<!-- Ex: Servidor da netflix que envia o filme para sua televisão. -->


<!-- Pedido / Resposta -->
<!-- O Cliente envia um pedido (request); o servidor envia uma resposta (response) -->

<!-- Processamento -->
<!-- O cliente mostra o resultado ; o servidor faz a parte mais pesada (banco de dados, cálculos) -->
